<!DOCTYPE html>
<html>
<head>
    <title>ICP Grader</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-96 text-center">

    <h1 class="text-3xl font-bold mb-3">
        ICP Grader
    </h1>

    <p class="text-gray-500 mb-6">
        Sign in using your ICP account
    </p>

    <a href="/login"
       class="flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-3 hover:bg-gray-50">

        <img
            src="https://www.svgrepo.com/show/475656/google-color.svg"
            width="24"
        >

        <span class="font-medium">
            Sign in with Google
        </span>
    </a>

    <p class="text-sm text-gray-400 mt-4">
        Only @icp.edu.np email addresses are allowed.
    </p>

</div>

</body>
</html>
